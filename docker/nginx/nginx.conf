server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Root para frontend
    root /var/www/html/frontend;
    index index.html;

    # IMPORTANTE: /storage PRIMERO (antes de archivos estáticos genéricos)
    # Servir archivos de storage de Laravel
    location ^~ /storage {
        alias /var/www/html/storage/app/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        access_log off;
        try_files $uri =404;
    }

    # Backend API Laravel - TODAS las peticiones /api/* van a PHP-FPM
    location ~ ^/api(.*)$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_param REQUEST_URI /api$1;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        include fastcgi_params;
    }

    # Frontend - SPA React (después de API y storage)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos del frontend (no de storage)
    location ~* ^(?!/storage).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}
