server {
    listen 80;
    server_name localhost adsoproyectos.xyz;

    # Raíz: Frontend React
    root /var/www/html/frontend;
    index index.html;
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Frontend - SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Laravel
    location /api/ {
        # Reescribir para remover /api del path que llega a Laravel
        rewrite ^/api/(.*)$ /$1 break;
        
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        
        # Pasar la URI original
        fastcgi_param REQUEST_URI /api/$1?$query_string;
        fastcgi_param QUERY_STRING $query_string;
        
        # Headers necesarios
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        
        include fastcgi_params;
    }

    # Servir archivos de storage de Laravel
    location /storage/ {
        alias /var/www/html/backend/public/storage/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Archivos estáticos con caché
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}